# Denova Docker Compose 部署。
# 数据通过 ./data 绑定挂载持久化，不使用 Docker named volume。
# 部署配置直接写在本文件中；修改密码后即可 docker compose up -d。
# 注意：如在本仓库目录内修改，请勿将真实密码提交到远程仓库。
services:
  denova:
    image: ghcr.io/planetsider/denova:latest
    container_name: denova
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      DENOVA_DIR: /data/.denova
      DENOVA_WORKSPACE: /data/workspace
      DENOVA_ALLOW_LAN_ACCESS: "true"
      # 通过 HTTPS 反向代理（NAS 远程访问、Caddy/Nginx 等）访问时改为 "true"，
      # 让后端信任代理的 X-Forwarded-Host/Proto；直连 HTTP 保持 "false"。
      DENOVA_TRUST_PROXY: "false"
      # 远程登录凭据；首次启动前务必修改密码。
      DENOVA_REMOTE_ACCESS_USERNAME: admin
      DENOVA_REMOTE_ACCESS_PASSWORD: change-me
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/auth/status').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
